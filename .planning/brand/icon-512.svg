<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    AI Habit Quest — official icon (512×512).
    Onyx Sport Luxury: deep base + electric violet halo + green completion arc
    + central "Q" mark formed by a circle with a notch (quest checkpoint).
  -->
  <defs>
    <!-- Base onyx gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11131a" />
      <stop offset="50%" stop-color="#0c0d12" />
      <stop offset="100%" stop-color="#06070a" />
    </linearGradient>
    <!-- Halo gradient (electric violet → emerald) -->
    <linearGradient id="halo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cff" />
      <stop offset="55%" stop-color="#9b7dff" />
      <stop offset="100%" stop-color="#19d57a" />
    </linearGradient>
    <!-- Inner glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background tile (rounded square, app-icon style) -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bg)" />

  <!-- Soft violet bloom (top-left) -->
  <circle cx="170" cy="160" r="180" fill="#7c5cff" opacity="0.22" filter="url(#glow)" />
  <!-- Soft green bloom (bottom-right) -->
  <circle cx="380" cy="380" r="160" fill="#19d57a" opacity="0.14" filter="url(#glow)" />

  <!-- Outer progress ring (3/4 fill — visual quest motif) -->
  <g transform="translate(256 256)">
    <!-- Track -->
    <circle r="148" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="22" />
    <!-- Filled progress arc (gradient, ~75% sweep, rounded caps) -->
    <circle
      r="148"
      fill="none"
      stroke="url(#halo)"
      stroke-width="22"
      stroke-linecap="round"
      stroke-dasharray="697 232"
      stroke-dashoffset="174"
      transform="rotate(-90)"
    />
  </g>

  <!-- Central monogram: rounded "Q" — open at bottom-right (quest checkpoint) -->
  <g transform="translate(256 256)" stroke="#f5f7fb" stroke-width="22" stroke-linecap="round" fill="none">
    <!-- Open ring -->
    <circle r="74" stroke-dasharray="380 84" stroke-dashoffset="-32" />
    <!-- Diagonal tail -->
    <line x1="40" y1="40" x2="78" y2="78" />
  </g>

  <!-- Bottom-right checkmark badge (signals "done"/quest complete) -->
  <g transform="translate(372 372)">
    <circle r="38" fill="#19d57a" />
    <polyline
      points="-14,2 -3,14 16,-10"
      fill="none"
      stroke="#0c0d12"
      stroke-width="9"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
