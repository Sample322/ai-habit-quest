server {
  # Listen on 8080 — Timeweb Cloud Apps reserve 80/443 for its reverse proxy.
  # Locally we still expose 8080 and map host:5173 -> container:8080.
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Security headers — defence in depth on top of helmet on the API side.
  # Locks the page out of cross-site framing, declares no MIME sniffing, and
  # tells browsers to enforce HTTPS for a year.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Block sourcemaps — Vite builds with sourcemap:'hidden' so the bundled
  # JS no longer points at them, but Sentry uploads need them on disk. We
  # still want to deny direct fetches in case someone guesses the filename.
  location ~* \.map$ {
    return 404;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long cache for hashed assets, none for index.html
  location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|webp|ico)$ {
    expires 30d;
    access_log off;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
